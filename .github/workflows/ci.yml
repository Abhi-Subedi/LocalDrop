name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref; a force-push should not burn minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ---- fast feedback: things that need no services -------------------------
  lint:
    name: Lint & types
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install --disable-pip-version-check -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy src

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: oxlint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: build
        run: npm run build

      - name: The build must produce a SPA the backend can serve
        run: test -f ../backend/src/localdrop/static/index.html

  docs-sync:
    name: Docs & release metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: One version, one source of truth
        run: python scripts/check_version.py

      - name: CONFIGURATION.md documents every LOCALDROP_ setting
        run: python scripts/check_config_docs.py

      - name: Every requirement has a test referencing its id
        run: python scripts/check_fr_traceability.py

      - name: Installers and the release pipeline agree on artefact names
        run: python scripts/check_release_contract.py

      - name: install.sh and uninstall.sh are valid POSIX shell
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=error install.sh uninstall.sh \
            scripts/backup.sh scripts/restore.sh docker/entrypoint.sh

  # ---- the suite that needs PostgreSQL -------------------------------------
  test:
    name: Tests (postgres ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: localdrop_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install --disable-pip-version-check -e ".[dev]"

      # The suite is deliberately unmocked: real PostgreSQL, real filesystem.
      - name: pytest
        env:
          LOCALDROP_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5433/localdrop_test
        run: python -m pytest tests/ -q --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: backend/pytest-report.xml
          retention-days: 7

  # ---- packaging must stay buildable ---------------------------------------
  package:
    name: Frozen binary builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the web UI
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build

      - name: Build and self-check the Linux binary
        run: |
          cd backend
          pip install --disable-pip-version-check ".[dev]"
          python ../packaging/build-binary.py --onefile

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: localdrop:ci
          build-args: |
            LOCALDROP_VERSION=ci
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image must report a healthy version
        run: |
          set -euo pipefail

          # 1. The bundle is intact: every packaged resource, the C extensions
          #    and the app factory. This is the same check the release pipeline
          #    gates on, run against the image.
          echo "--- bundle self-check ---"
          docker run --rm --entrypoint localdrop localdrop:ci --check

          # 2. The container actually serves traffic. This needs a real database,
          #    because the entrypoint deliberately aborts when migrations cannot
          #    run — an earlier version of this step pointed at an unreachable
          #    database and asserted the app would come up anyway, which is not
          #    how the container behaves and never was.
          echo "--- boot against a real database ---"
          docker network create ld-smoke
          docker run -d --name pg --network ld-smoke \
            -e POSTGRES_PASSWORD=ci-smoke -e POSTGRES_DB=localdrop \
            postgres:16-alpine

          for i in $(seq 1 60); do
            if docker exec pg pg_isready -U postgres -d localdrop >/dev/null 2>&1; then break; fi
            [ "$i" -eq 60 ] && { echo "postgres never became ready"; exit 1; }
            sleep 1
          done

          key=$(python3 -c 'import secrets;print(secrets.token_hex(32))')
          docker run -d --name app --network ld-smoke -p 18080:8080 \
            -e LOCALDROP_SECRET_KEY="$key" \
            -e LOCALDROP_DATABASE_URL='postgresql+psycopg://postgres:ci-smoke@pg:5432/localdrop' \
            localdrop:ci

          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/v1/health/ready; then
              echo; ok=1; break
            fi
            sleep 2
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::the container never reported ready"
            docker logs app || true
            docker logs pg || true
            exit 1
          fi

          # The container must report the version the *source* declares. Not the
          # LOCALDROP_VERSION build arg: that exists to stamp the OCI label, and
          # the running server truthfully reports the code it was built from.
          # Comparing against __about__.py is also the useful check — it fails
          # if the image is stale, or if the version is baked in twice.
          #
          # sed rather than a multi-line `python3 -c`: continuation lines at
          # column 0 terminate the YAML block scalar, and that failure is
          # baffling because the workflow file still looks like YAML.
          want=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' backend/src/localdrop/__about__.py)
          [ -n "$want" ] || { echo "::error::could not read __version__ from __about__.py"; exit 1; }
          version=$(curl -fsS http://127.0.0.1:18080/api/v1/version | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')
          echo "source says $want · image reports $version"
          [ "$version" = "$want" ] || { echo "::error::the image reports $version, the source says $want"; exit 1; }

          # The web UI must be served from the bundle, not a 404 or a JSON error.
          curl -fsS http://127.0.0.1:18080/ | grep -q '<div id="root">'

          docker rm -f app pg >/dev/null
          docker network rm ld-smoke >/dev/null
          echo "image builds, self-checks, migrates and serves"
