name: Release

# Cutting a release is: bump __about__.py, merge, then tag.
#
#   git tag -a v1.2.0 -m "1.2.0" && git push origin v1.2.0
#
# This workflow then builds, verifies, signs-by-checksum and publishes:
#   - frozen binaries for linux/{x64,arm64} and macos/{x64,arm64} (onefile)
#     and windows-x64 (onedir + a portable zip + an Inno Setup installer)
#   - SHA256SUMS covering every artefact
#   - a multi-arch container image on ghcr.io (:<ver>, :<major>, :stable, :latest)
#   - a GitHub Release with the CHANGELOG section as its notes
#   - a VERSION file the installers read to resolve "stable"
#   - the Homebrew formula, pushed to the personal tap when TAP_REPO is set
#
# PyInstaller cannot cross-compile, so each platform is built on its own runner.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.1.0"
        required: true

permissions:
  contents: write   # create the Release
  packages: write   # push to ghcr.io
  id-token: write   # OIDC, for provenance attestations
  attestations: write # actions/attest-build-provenance needs this; without it
                       # the release publishes and only the attestation step fails

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # --------------------------------------------------------------------------
  # 0. Work out the version and prove the tag matches the code
  # --------------------------------------------------------------------------
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - id: meta
        run: |
          set -euo pipefail
          VERSION=$(python -c "import re,pathlib; \
            print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', \
            pathlib.Path('backend/src/localdrop/__about__.py').read_text()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.tag }}" != "" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match __about__.py version $VERSION."
            echo "::error::Bump backend/src/localdrop/__about__.py first, or retag."
            exit 1
          fi
          case "$VERSION" in *-*|*rc*|*alpha*|*beta*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          echo "releasing v$VERSION"

      - name: Refuse to ship an unrunnable tree
        run: |
          pip install --disable-pip-version-check pytest ruff
          python scripts/check_version.py
          python scripts/check_release_contract.py
          ruff check backend

  # --------------------------------------------------------------------------
  # 1. Binaries, one job per platform (no cross-compilation)
  # --------------------------------------------------------------------------
  binary:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    # A runner label that no longer exists leaves the job "Waiting for a runner"
    # until the 6-hour job cap, which stalls the whole release for a long time to
    # report a typo. 45 minutes is far longer than any of these builds takes
    # (the slowest observed is the Windows one at ~8 min including the installer)
    # and turns an unavailable runner into a fast, legible failure.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            asset: linux-x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            asset: linux-arm64
          # macos-13 was retired by GitHub; the Intel runner is now macos-15-intel.
          # A stale label does not error, it waits forever, so this is worth the
          # comment.
          - name: macos-x64
            os: macos-15-intel
            asset: macos-x64
          - name: macos-arm64
            os: macos-15
            asset: macos-arm64
          - name: windows-x64
            os: windows-2022
            asset: windows-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the web UI (the backend serves it)
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build

      - name: Install the backend with the build toolchain
        working-directory: backend
        run: pip install --disable-pip-version-check ".[dev,build]"

      - name: Build and self-check the binary
        working-directory: backend
        run: python ../packaging/build-binary.py --zip

      - name: Build the Windows installer
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          # Do NOT `choco install innosetup`. Inno Setup is already on the runner
          # image, and Chocolatey then *refuses* the install because a newer
          # version is present ("A newer version of InnoSetup is already
          # installed"), exiting non-zero and taking the job with it. Pinning a
          # version is worse: the community repository retires exact versions,
          # so a pin eventually fails a release over nothing to do with LocalDrop.
          #
          # Find the compiler that is already there.
          $iscc = (Get-ChildItem -Path @(
              "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe",
              "$env:ProgramFiles\Inno Setup*\ISCC.exe"
            ) -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1).FullName
          if (-not $iscc) {
            throw "ISCC.exe not found. If the runner image stops shipping Inno Setup, " +
                  "add: choco install innosetup --no-progress -y --allow-downgrade"
          }
          Write-Host "Using $iscc"

          # Verify the payload BEFORE compiling. The [Files] globs in
          # localdrop.iss are relative to the .iss directory (packaging/windows),
          # so from the repo root they resolve to dist/release/localdrop. Inno
          # resolves a non-matching glob to nothing and still compiles happily,
          # which produces a valid-looking installer with no application in it.
          $payload = "dist\release\localdrop\localdrop.exe"
          if (-not (Test-Path $payload)) {
            throw "the frozen payload is missing at $payload. The [Files] paths in " +
                  "localdrop.iss point at ..\..\dist\release\localdrop - either the " +
                  "binary build did not run, or those paths are wrong."
          }
          $payloadMiB = [math]::Round((Get-ChildItem dist\release\localdrop -Recurse -File |
                          Measure-Object Length -Sum).Sum / 1MB, 1)
          Write-Host "payload present: $payload ($payloadMiB MiB)"

          & $iscc "/DAppVersion=${{ needs.prepare.outputs.version }}" `
                  "packaging\windows\localdrop.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }

          $setup = @(Get-ChildItem dist\release\*-setup.exe -ErrorAction SilentlyContinue)
          if ($setup.Count -ne 1) { throw "expected exactly one installer, found $($setup.Count)" }
          $mib = [math]::Round($setup[0].Length / 1MB, 1)
          $setup[0] | Select-Object Name, @{n='MiB';e={$mib}}
          # LZMA2 max on 63 MiB of payload lands around 35-40 MiB. Anything under
          # 20 MiB means the payload did not make it in.
          if ($mib -lt 20) {
            throw "the installer is only $mib MiB but the payload is $payloadMiB MiB. " +
                  "The [Files] globs did not match. Do not publish this."
          }

      - name: Collect artefacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.asset }}
          path: |
            dist/release/localdrop-${{ needs.prepare.outputs.version }}-${{ matrix.asset }}.tar.gz
            dist/release/LocalDrop-${{ needs.prepare.outputs.version }}-${{ matrix.asset }}.zip
            dist/release/LocalDrop-${{ needs.prepare.outputs.version }}-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 7

  # --------------------------------------------------------------------------
  # 2. Container image: linux/amd64 + linux/arm64
  # --------------------------------------------------------------------------
  image:
    name: Container image
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=LocalDrop
            org.opencontainers.image.description=Self-hosted, local-network-first file sharing.
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LOCALDROP_VERSION=${{ needs.prepare.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A package published with GITHUB_TOKEN is private by default, even for a
      # public repository, and no token can change that from here. Until someone
      # clicks "Change visibility -> Public" in the package settings, every
      # user's `docker compose pull` fails with `denied`. Say so loudly, at the
      # point where the maintainer is already looking at the run.
      - name: Remind the maintainer to publish the package
        run: |
          {
            echo "### Image pushed"
            echo
            echo '`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}`'
            echo
            echo "**If this is the first release, the package is private.**"
            echo "Until you change that, \`docker compose pull\` fails for everyone"
            echo "with \`denied\`. One click:"
            echo
            echo "1. https://github.com/Abhi-Subedi/LocalDrop/packages"
            echo "2. Click \`localdrop\` -> **Settings** -> **Change visibility** -> **Public**"
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  # 3. Checksums, attestation, Homebrew, GitHub Release
  # --------------------------------------------------------------------------
  publish:
    name: Publish release
    needs: [prepare, binary, image]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # Fetch each artifact's zip directly rather than through
      # actions/download-artifact. That action failed four times in a row on
      # this release with "artifact download failed after 5 retries" even though
      # every artifact was present, unexpired and intact — roughly 240 MB across
      # six artifacts is past the point where it is dependable.
      #
      # Doing it by hand is not more code, it is more control: each artifact gets
      # its own retry budget and its own error message, so a failure names the
      # culprit instead of arriving as one opaque error.
      - name: Download every artefact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist/release work

          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
                  --jq '.artifacts[] | select(.name | startswith("binary-")) | "\(.id) \(.name)"')
          if [ -z "$ids" ]; then
            echo "::error::no binary-* artifacts found on this run"; exit 1
          fi
          echo "$ids" | sed 's/^/  will fetch: /'

          # Iterate over ids only. `for id in $ids` would also visit the name
          # token from each line and request artifacts/binary-linux-arm64/zip,
          # which is not an id - an error that is tedious to read and fails
          # every single run in the same place.
          for id in $(echo "$ids" | awk '{print $1}'); do
            name=$(echo "$ids" | awk -v want="$id" '$1 == want {print $2}')
            zip="work/artifact-$id.zip"
            ok=0
            for attempt in 1 2 3 4 5; do
              if gh api -H "Accept: application/vnd.github+json" \
                    "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$zip"; then
                ok=1; break
              fi
              echo "  attempt $attempt for $name (id $id) failed; retrying"
              sleep $((attempt * 5))
            done
            [ "$ok" -eq 1 ] || { echo "::error::$name (id $id) failed 5 times"; exit 1; }
            unzip -oq "$zip" -d "work/unpacked-$id"
            rm -f "$zip"
            got=$(find "work/unpacked-$id" -type f | wc -l)
            echo "  $name -> $got file(s)"
            [ "$got" -gt 0 ] || { echo "::error::$name unpacked to nothing"; exit 1; }
          done

          find work -type f -exec cp {} dist/release/ \;
          rm -rf work

      - name: Collect them into one directory
        run: |
          set -euo pipefail
          echo "collected:"; ls -la dist/release/
          # Every platform must have contributed its archive, or the checksums
          # and the release would silently ship an incomplete set. A release with
          # four of five platforms is worse than a failed build.
          missing=""
          for slug in linux-x64 linux-arm64 macos-x64 macos-arm64; do
            [ -f "dist/release/localdrop-${{ needs.prepare.outputs.version }}-$slug.tar.gz" ] \
              || missing="$missing $slug"
          done
          [ -f "dist/release/LocalDrop-${{ needs.prepare.outputs.version }}-windows-x64.zip" ] \
            || missing="$missing windows-zip"
          [ -f "dist/release/LocalDrop-${{ needs.prepare.outputs.version }}-windows-x64-setup.exe" ] \
            || missing="$missing windows-installer"
          if [ -n "$missing" ]; then
            echo "::error::missing artefacts:$missing"; exit 1
          fi
          echo "all six artefacts present"

      - name: SHA256SUMS
        run: |
          cd dist/release
          # Covers every archive and the installer, so a user can verify
          # whatever they downloaded with one command.
          sha256sum ./*.tar.gz ./*.zip ./*.exe > SHA256SUMS
          cat SHA256SUMS
          # Fail loudly rather than ship an unchecksummed artefact.
          test -s SHA256SUMS

      - name: Assemble the release notes from CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          python - "$VERSION" <<'PY' > release-notes.md
          import pathlib, re, sys
          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Everything between this version's heading and the next one.
          m = re.search(rf"^## \[{re.escape(version)}\].*?$(.*?)(?=^## \[|\Z)",
                        text, re.M | re.S)
          if not m:
              sys.exit(f"CHANGELOG.md has no [{version}] section")
          print(f"# LocalDrop {version}\n")
          print(m.group(0).strip())
          print(f"\n---\n\n**Full changelog:** "
                f"https://github.com/${{ github.repository }}/blob/v{version}/CHANGELOG.md")
          print(f"\n**Upgrade notes:** forward-only migrations. Take a backup first "
                f"(docs/BACKUP.md).")
          PY
          head -40 release-notes.md

      - name: Update the Homebrew formula
        id: brew
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          SCRIPT=packaging/update-brew-formula.py
          [ -f "$SCRIPT" ] || { echo "no $SCRIPT; skipping"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; }
          python "$SCRIPT" --version "$VERSION" --check-only || true
          # Real checksums for both macOS arches. The slugs must match
          # packaging/build-binary.py platform_slug(), or the formula ships a
          # 404 for every Intel Mac.
          ARM=$(grep "localdrop-$VERSION-macos-arm64.tar.gz"  dist/release/SHA256SUMS | cut -d' ' -f1)
          X64=$(grep "localdrop-$VERSION-macos-x64.tar.gz"    dist/release/SHA256SUMS | cut -d' ' -f1)
          if [ -z "$ARM" ] || [ -z "$X64" ]; then
            echo "::error::no macOS tarball checksums in SHA256SUMS; cannot update the formula"
            exit 1
          fi
          python "$SCRIPT" --version "$VERSION" --sha256-arm64 "$ARM" --sha256-x64 "$X64"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          cat packaging/homebrew/localdrop.rb

      - name: Commit VERSION and the formula
        if: steps.brew.outputs.changed == 'true'
        # Tolerated failure on purpose. `main` requires a pull request and does
        # not exempt GITHUB_TOKEN, so this push is rejected — and it should be.
        # The alternative is adding the Actions app as a bypass actor, which
        # would let any workflow write to main unattended. VERSION and the
        # formula are derived conveniences: the release is already published
        # without them, and a maintainer lands the commit with the next PR.
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "${{ needs.prepare.outputs.version }}" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION packaging/homebrew/localdrop.rb
          # Only commit if something actually differs.
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore(release): ${{ needs.prepare.outputs.version }} VERSION + formula"
            if ! git push origin HEAD:main; then
              echo "::warning::could not push VERSION/the formula to main (branch protection)."
              echo "::warning::The release itself is unaffected. Commit these two files with"
              echo "::warning::your next PR, or run: gh pr create --title 'chore: 1.1.0 VERSION + formula'"
              exit 0
            fi
            echo "pushed VERSION and the formula to main"
          fi

      - name: Push the formula to the Homebrew tap
        if: steps.brew.outputs.changed == 'true'
        env:
          TAP_REPO: ${{ vars.TAP_REPO }}       # e.g. Abhi-Subedi/homebrew-localdrop
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}  # fine-grained PAT, contents:write on the tap
        run: |
          set -euo pipefail
          if [ -z "$TAP_REPO" ] || [ -z "$TAP_TOKEN" ]; then
            echo "::notice::TAP_REPO or TAP_TOKEN is not set - skipping the tap push."
            echo "::notice::The formula is committed in packaging/homebrew/localdrop.rb;"
            echo "::notice::a maintainer can run 'brew tap-update' manually."
            exit 0
          fi
          # A brew tap is a git repo whose <Formula>.rb files sit at the root.
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          cp packaging/homebrew/localdrop.rb "tap/localdrop.rb"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- localdrop.rb; then
            echo "tap already at ${{ needs.prepare.outputs.version }}"
          else
            git add localdrop.rb
            git commit -m "localdrop ${{ needs.prepare.outputs.version }}"
            git push
            echo "pushed localdrop ${{ needs.prepare.outputs.version }} to $TAP_REPO"
          fi

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LocalDrop ${{ needs.prepare.outputs.version }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          files: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/*-setup.exe
            dist/release/SHA256SUMS
            LICENSE
            README.md
            docker-compose.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Provenance for the release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/release/*"
