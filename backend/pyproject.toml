[project]
name = "localdrop"
version = "1.0.0"
description = "Self-hosted, local-network-first file sharing."
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "fastapi>=0.115",
    # Floor guarantees the GHSA-7f5h-v6xp-fcq8 multi-range DoS fix; the app
    # additionally serves single-range responses only (see services/downloads.py).
    "starlette>=0.41",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.40",
    "alembic>=1.13",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "argon2-cffi>=23.1",
    "Pillow>=10.3",
    "qrcode>=7.4",
    "prometheus-client>=0.20",
    "greenlet>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
localdrop = "localdrop.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localdrop"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert in tests / internal code paths

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = false
ignore_missing_imports = true
plugins = []
