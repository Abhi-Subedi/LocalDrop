# LocalDrop production stack: app + PostgreSQL 16. No proxy, no Redis.
#
# First install:
#   git clone https://github.com/Abhi-Subedi/LocalDrop.git && cd LocalDrop
#   cp .env.example .env        # then set LOCALDROP_SECRET_KEY + POSTGRES_PASSWORD
#   docker compose up -d
#   docker compose logs -f app  # shows the LAN URL + first-run setup token
#
# The image is pulled from GitHub Container Registry; there is no local build
# step. `docker compose build` is not needed and `build:` is intentionally
# absent so a stale local image can never shadow a newer release.
#
# Upgrade (1.0.0 -> 1.1.0 is forward-only; take a backup first, see docs/BACKUP.md):
#   ./scripts/backup.sh
#   docker compose pull && docker compose up -d
#   docker compose logs -f app   # watch the migration
#
# Pin a version for reproducible deploys by setting LOCALDROP_IMAGE_TAG in .env
# (e.g. 1.1.0). Default `stable` always tracks the newest release.

name: localdrop

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: localdrop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: localdrop
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ld
    # NOTE: no ports published — the database is reachable only inside the stack.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localdrop -d localdrop"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: ghcr.io/abhi-subedi/localdrop:${LOCALDROP_IMAGE_TAG:-stable}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LOCALDROP_DATABASE_URL: postgresql+psycopg://localdrop:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/localdrop
      LOCALDROP_SECRET_KEY: ${LOCALDROP_SECRET_KEY:?set LOCALDROP_SECRET_KEY in .env (min 32 chars)}
      LOCALDROP_DATA_DIR: /data
      LOCALDROP_PORT: 8080
      LOCALDROP_PUBLIC_URL: ${LOCALDROP_PUBLIC_URL:-}
      LOCALDROP_MAX_UPLOAD_BYTES: ${LOCALDROP_MAX_UPLOAD_BYTES:-107374182400}
      LOCALDROP_TRUSTED_PROXIES: ${LOCALDROP_TRUSTED_PROXIES:-0}
      LOCALDROP_BACKUP_BEFORE_MIGRATE: 1
      LOCALDROP_LOG_FORMAT: json
    volumes:
      - appdata:/data
    ports:
      - "${LOCALDROP_HOST_PORT:-8080}:8080"
    networks:
      - ld
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      # Large uploads arrive as many tus chunks; keep the file-descriptor
      # ceiling high enough that a busy server never hits EMFILE.
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/api/v1/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
    name: localdrop-pgdata
  appdata:
    name: localdrop-appdata

networks:
  ld:
    name: localdrop
    driver: bridge
